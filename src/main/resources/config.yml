# NexusMap configuration

map:
  world: world

  # zoom levels, in blocks-per-pixel. Each is its own cached map the
  # player can cycle through by right-clicking the held map item.
  # Smaller number = more detail, less coverage. Order matters -- this
  # is also the cycle order (wraps around).
  zoom-levels: [16, 32, 64]

  # which entry in zoom-levels /nexusmap give hands out by default
  # (0-indexed)
  default-zoom-index: 1

  # The map recenters on whoever's holding it, live, as they move --
  # there's no fixed center point anymore. Coverage instead grows
  # outward as players explore, like a vanilla map's fog of war.
  #
  # This interval controls how often ALREADY-explored terrain gets
  # rescanned (picks up new builds/terrain changes over time), in
  # minutes -- it's not how often new areas get revealed, that happens
  # continuously as players walk around.
  refresh-interval-minutes: 10

  # how many cells to scan per server tick, spread out to avoid a lag
  # spike. Applies both to newly-explored area and to the periodic
  # rescan above.
  pixels-per-tick: 64

  # Bukkit calls the map's render() once per viewer roughly every server
  # tick (20/sec) for as long as the item is held/visible -- and touching
  # the canvas at all, even if nothing actually changed, makes the server
  # send that viewer a full map update packet. Redrawing (and re-sending)
  # 20 times a second per viewer regardless of whether they'd even moved
  # was the real cost behind noticeable lag with more than a couple of
  # players using the map at once. This is the minimum real-world gap (in
  # ticks; 20 ticks = 1 second) between actual redraws for a given viewer
  # -- the default of 4 means at most 5 redraws/sec per viewer instead of
  # 20. Raise it further if lag is still an issue with a lot of
  # simultaneous map users; lower it (toward 1) for the smoothest possible
  # cursor movement if you have server room to spare.
  render-interval-ticks: 4

pois: []
