# NexusMap configuration

map:
  world: world
  # the map is centered here -- pick your spawn, or the middle of your
  # explored/built area
  center-x: 0
  center-z: 0

  # zoom levels, in blocks-per-pixel. Each is its own cached map the
  # player can cycle through by right-clicking the held map item.
  # Smaller number = more detail, less coverage. Order matters -- this
  # is also the cycle order (wraps around).
  zoom-levels: [16, 32, 64]

  # which entry in zoom-levels /nexusmap give hands out by default
  # (0-indexed)
  default-zoom-index: 1

  # how often the terrain layer redraws, in minutes. Terrain scanning
  # touches a lot of chunks and can be heavy -- see README before
  # setting this aggressively low.
  refresh-interval-minutes: 10

  # how many pixels to scan per server tick while refreshing, spread out
  # to avoid a lag spike. 128*128 = 16384 total pixels per full refresh.
  pixels-per-tick: 64

pois: []
